{% extends "inspections/base.html" %}
{% block content %}
    <a class="back-link" href="{{ cancel_url }}">
        <svg class="arrow-icon back" aria-hidden="true">
            <use href="#i-arrow" />
        </svg>
    Back</a>
    <div class="page-heading">
        <div>
            <div class="eyebrow">{{ eyebrow }}</div>
            <h1>
                {{ title }}<span class="heading-dot">.</span>
            </h1>
            <p>{{ description }}</p>
        </div>
    </div>
    <section class="panel form-panel">
        <form method="post" data-dirty-form>
            {% csrf_token %}
            {% if inspection.pk %}
                <input type="hidden" name="version" value="{{ inspection.version }}">
            {% endif %}{{ form.as_p }}<div class="form-actions">
                <a class="btn secondary" href="{{ cancel_url }}">Cancel</a>
                <button class="btn primary"
                        type="submit">Save {% if page == "assets" %}asset{% else %}inspection{% endif %} <svg>
                    <use href="#i-arrow" />
                    </svg>
                </button>
            </div>
        </form>
    </section>
{% endblock %}
