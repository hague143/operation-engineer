<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101f2c">
  <meta name="description" content="AssetInspect: an interactive offline portfolio demonstration of visual infrastructure inspection.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AssetInspect · Offline portfolio demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2240%22%20height%3D%2240%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2211%22%20fill%3D%22%2314b8a6%22%2F%3E%3Cg%20stroke%3D%22%23092d37%22%20stroke-width%3D%222.4%22%20fill%3D%22none%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m20%208%2011%206.5v11L20%2032%209%2025.5v-11L20%208Z%22%2F%3E%3Cpath%20d%3D%22m9%2014.5%2011%207%2011-7m-11%207V32%22%2F%3E%3Cpath%20d%3D%22m15%2018%205-9%205%209%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A">
  <style>:root {
  --navy: #101f2c;
  --navy-deep: #0d1a25;
  --teal: #087f75;
  --mint: #1db9a7;
  --ink: #1d303e;
  --muted: #6d7c86;
  --border: #e2e8eb;
  --surface: #f5f7f9;
  --red: #b63849;
  --amber: #9b650c;
  --radius: 12px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font:
    14px/1.55 system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}
a {
  color: inherit;
  text-decoration: none;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea,
summary {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
svg.icon,
svg {
  vertical-align: middle;
}
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid #19b8a7;
  outline-offset: 4px;
}
input,
select,
textarea {
  max-width: 100%;
  border: 1px solid #cbd6dc;
  border-radius: 7px;
  background: white;
  color: var(--ink);
  padding: 11px 12px;
  min-height: 44px;
}
input:focus,
select:focus,
textarea:focus {
  border-color: var(--teal);
}
textarea {
  width: 100%;
  resize: vertical;
}
input[type="checkbox"] {
  width: 18px;
  min-height: 18px;
  accent-color: var(--teal);
}
input[type="file"] {
  font-size: 12px;
  width: 100%;
  background: white;
}
h1,
h2,
h3,
h4,
p {
  margin-top: 0;
}
h1 {
  font-size: 30px;
  letter-spacing: -1.1px;
  line-height: 1.25;
  margin-bottom: 8px;
  font-weight: 650;
}
h2 {
  font-size: 17px;
  line-height: 1.4;
  letter-spacing: -0.35px;
  margin-bottom: 10px;
  font-weight: 650;
}
h3 {
  font-size: 15px;
  margin-bottom: 9px;
}
h4 {
  font-size: 14px;
}
p {
  margin-bottom: 14px;
}
.muted {
  color: var(--muted);
}
.icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.svg-library {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: fixed;
  top: -100px;
  left: 20px;
  z-index: 100;
  background: white;
  padding: 12px;
}
.skip-link:focus {
  top: 10px;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 240px;
  background: var(--navy);
  color: #9aaebd;
  display: flex;
  flex-direction: column;
  padding: 30px 19px 0;
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.8px;
  line-height: 1.15;
}
.brand-light {
  font-weight: 400;
}
.brand small {
  display: block;
  font-size: 7.6px;
  letter-spacing: 1.15px;
  color: #9eb5c4;
  font-weight: 500;
  margin-top: 7px;
}
.workspace-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 17px 9px;
  margin: 33px 0 25px;
  border: 1px solid #2a3b48;
  border-radius: 8px;
  color: #e5edf2;
  font-size: 11px;
}
.workspace-icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  font-size: 10px;
  color: #7fe0d3;
  background: #1c3b44;
  border: 1px solid #31616a;
  border-radius: 6px;
}
.workspace-label small {
  display: block;
  font-size: 10px;
  color: #96a9b9;
  margin-top: 2px;
}
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #31c8ac;
  border-radius: 50%;
  vertical-align: middle;
}
.workspace-label .live-dot {
  margin-left: 5px;
}
.nav-label {
  font-size: 9px;
  letter-spacing: 1.7px;
  color: #748a9b;
  margin: 0 13px 12px;
}
nav a {
  display: flex;
  align-items: center;
  gap: 13px;
  border-radius: 7px;
  padding: 12px 14px;
  font-size: 12px;
  font-weight: 500;
  margin: 4px 0;
  transition:
    background 0.15s,
    color 0.15s;
}
nav a svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
nav a:hover {
  background: #1c303e;
  color: #fff;
}
nav a.active {
  background: #153e44;
  color: #6ee0cb;
  box-shadow: inset 3px 0 #23b7a1;
}
.nav-count {
  margin-left: auto;
  background: #25484b;
  color: #9ddacb;
  border-radius: 5px;
  font-size: 10px;
  padding: 1px 7px;
}
.sidebar-bottom {
  margin-top: auto;
}
.portfolio-note {
  font-size: 8px;
  letter-spacing: 1px;
  padding: 20px 10px 22px;
}
.portfolio-note .live-dot {
  width: 5px;
  height: 5px;
  margin-right: 5px;
}
.portfolio-note small {
  display: block;
  font-size: 10px;
  letter-spacing: 0;
  line-height: 1.8;
  margin-top: 9px;
  color: #8299a9;
}
.user-block {
  border-top: 1px solid #2c3c48;
  padding: 19px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 33px;
  height: 33px;
  border-radius: 50%;
  background: #2c424c;
  color: #c4e3e3;
  font-size: 12px;
  font-weight: 600;
}
.user-block strong {
  font-size: 11px;
  display: block;
  color: #e4edf3;
  max-width: 127px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-block small {
  display: block;
  color: #8fa3b1;
  font-size: 10px;
}
.user-block form {
  margin-left: auto;
}
.logout {
  border: 0;
  background: transparent;
  color: #9db2c1;
  padding: 8px;
  font-size: 19px;
}
.app-shell {
  margin-left: 240px;
}
.topbar {
  height: 70px;
  border-bottom: 1px solid var(--border);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 38px;
  font-size: 11px;
}
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 14px;
  color: #8c9aa4;
}
.breadcrumbs strong {
  color: #465b69;
  font-weight: 500;
}
.crumb-slash {
  color: #ccd4d9;
}
.topbar-right {
  display: flex;
  gap: 24px;
  align-items: center;
}
.local-label {
  color: #6c7d85;
  font-size: 10px;
}
.local-label .live-dot {
  margin-right: 6px;
}
.topbar-date {
  border-left: 1px solid var(--border);
  padding-left: 24px;
  color: #60717e;
  font-size: 11px;
}
.mobile-menu {
  display: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  padding: 5px;
}
.main-content {
  padding: 32px 38px 0;
  max-width: 1640px;
  margin: auto;
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 27px;
}
.eyebrow {
  font-size: 9px;
  letter-spacing: 1.7px;
  color: #748892;
  font-weight: 650;
  margin-bottom: 11px;
}
.heading-dot {
  color: var(--teal);
}
.page-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
.page-heading h1 .badge {
  vertical-align: middle;
  margin-left: 9px;
  letter-spacing: 0;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 40px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  transition:
    background 0.15s,
    box-shadow 0.15s;
}
.btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn.primary {
  background: var(--teal);
  color: white;
  border-color: var(--teal);
  box-shadow: 0 2px 3px #0c797515;
}
.btn.primary:hover {
  background: #076a62;
  box-shadow: 0 3px 8px #0c79752a;
}
.btn.secondary {
  background: #fff;
  color: #445d69;
  border-color: #d9e2e7;
}
.btn.secondary:hover {
  background: #f0f5f6;
}
.full {
  width: 100%;
}
.button-group {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.overview-banner {
  position: relative;
  border-radius: var(--radius);
  padding: 27px 31px;
  background: linear-gradient(110deg, #133e43, #12373e);
  overflow: hidden;
  color: white;
  min-height: 242px;
  display: flex;
  align-items: center;
  margin-bottom: 22px;
}
.overview-banner > div {
  z-index: 1;
}
.banner-kicker {
  font-size: 8px;
  letter-spacing: 1.9px;
  color: #9fd1c8;
  display: block;
  margin-bottom: 13px;
}
.banner-kicker .live-dot {
  margin-right: 7px;
}
.overview-banner h2 {
  font-size: 29px;
  line-height: 1.19;
  letter-spacing: -0.8px;
  font-weight: 500;
  margin: 0 0 11px;
}
.overview-banner p {
  color: #a6c6c6;
  font-size: 11px;
  line-height: 1.8;
  margin-bottom: 16px;
}
.overview-banner a {
  color: #81d5c8;
  font-size: 10px;
  display: inline-flex;
  gap: 14px;
  align-items: center;
}
.overview-banner a svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 1.4;
  fill: none;
}
.infrastructure-art {
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 59%;
  opacity: 0.85;
}
.banner-corner {
  position: absolute;
  bottom: 17px;
  right: 23px;
  font-size: 7px;
  letter-spacing: 1.3px;
  color: #80a7a9;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 26px;
}
.stat-card {
  display: block;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 18px 18px 15px;
  transition:
    border 0.2s,
    transform 0.2s;
}
.stat-card:hover {
  border-color: #8fbbb5;
  transform: translateY(-2px);
}
.stat-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #5c6d79;
}
.stat-label svg {
  width: 29px;
  height: 29px;
  padding: 6px;
  background: #f0f4f7;
  border-radius: 7px;
  stroke: #6a7f8a;
  fill: none;
  stroke-width: 1.5;
}
.stat-value {
  font-size: 32px;
  line-height: 1.2;
  letter-spacing: -1px;
  margin: 12px 0 10px;
  font-weight: 550;
}
.stat-card > span {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: #8897a0;
  gap: 6px;
}
.stat-card > span > span {
  font-size: 13px;
  color: #a1aeb5;
}
.amber-stat .stat-value {
  color: #a37324;
}
.amber-stat .stat-label svg {
  background: #fcf4e5;
  color: #a37324;
  stroke: currentColor;
}
.teal-stat .stat-value {
  color: var(--teal);
}
.teal-stat .stat-label svg {
  background: #eaf7f3;
  color: var(--teal);
  stroke: currentColor;
}
.panel {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 22px;
  min-width: 0;
}
.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 21px 23px 19px;
}
.panel-heading h2 {
  font-size: 15px;
  margin-bottom: 4px;
}
.panel-heading p {
  color: var(--muted);
  font-size: 10px;
  margin: 0;
}
.text-link {
  display: inline-flex;
  gap: 15px;
  align-items: center;
  color: var(--teal);
  font-size: 10px;
  font-weight: 600;
  border: 0;
  background: transparent;
  padding: 5px 0;
}
.text-link:hover {
  text-decoration: underline;
}
.table-scroll {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
  white-space: nowrap;
}
th {
  font-size: 9px;
  font-weight: 500;
  color: #7d8b96;
  background: #fafbfc;
  border-top: 1px solid #edf1f3;
  border-bottom: 1px solid #edf1f3;
  padding: 12px 23px;
}
td {
  padding: 15px 23px;
  border-bottom: 1px solid #edf1f3;
  font-size: 11px;
  color: #536875;
}
tbody tr:last-child td {
  border-bottom: 0;
}
.table-primary {
  display: block;
  color: #294958;
  font-weight: 650;
  font-size: 11px;
}
.table-primary:hover {
  color: var(--teal);
  text-decoration: underline;
}
.table-secondary {
  display: block;
  font-size: 10px;
  color: #87969f;
  margin-top: 3px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 5px;
  padding: 4px 8px;
  font-size: 9px;
  line-height: 1.5;
  font-weight: 600;
  white-space: nowrap;
}
.badge:before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}
.badge.draft {
  background: #f0f3f6;
  color: #607686;
}
.badge.submitted {
  background: #fff5df;
  color: #9f6d1f;
}
.badge.approved,
.badge.severity-low {
  background: #e7f6ef;
  color: #218163;
}
.badge.changes,
.badge.severity-high {
  background: #fceef0;
  color: #b24453;
}
.badge.severity-medium {
  background: #fff5df;
  color: #9f6d1f;
}
.evidence-count {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
}
.evidence-count svg {
  width: 13px;
  height: 13px;
  stroke: #8da2ac;
  stroke-width: 1.6;
  fill: none;
}
.row-arrow {
  font-size: 18px;
  color: #90a3ad;
  padding: 8px;
  display: block;
}
.row-arrow:hover {
  color: var(--teal);
}
.dashboard-bottom {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 22px;
}
.small-label {
  font-size: 8px;
  letter-spacing: 1px;
  color: #8d9da6;
}
.findings-overview {
  padding: 0 23px 24px;
}
.severity-summary {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fcfdfd;
  margin-bottom: 22px;
}
.severity-summary > div {
  flex: 1;
  padding: 12px;
  display: grid;
  grid-template-columns: 10px 1fr;
  column-gap: 6px;
  align-items: center;
  border-right: 1px solid var(--border);
}
.severity-summary > div:last-child {
  border-right: 0;
}
.severity-summary strong {
  font-size: 21px;
  line-height: 1.4;
  font-weight: 550;
}
.severity-summary div > span:last-child {
  grid-column: 2;
  font-size: 9px;
  color: #7c8d98;
}
.severity-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.severity-dot.low {
  background: #198c80;
}
.severity-dot.medium {
  background: #d29a34;
}
.severity-dot.high {
  background: #c75964;
}
.category-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 10px 0;
  font-size: 9px;
  color: #70828e;
}
.category-row > span {
  width: 132px;
  flex-shrink: 0;
}
.bar-track {
  height: 5px;
  background: #f0f4f5;
  flex: 1;
  border-radius: 4px;
  overflow: hidden;
}
.bar-track > span {
  display: block;
  height: 5px;
  max-width: 100%;
  min-width: 0;
  background: #5ba89f;
  border-radius: 4px;
}
.category-row strong {
  font-size: 10px;
  font-weight: 500;
  min-width: 14px;
  color: #4f6977;
  text-align: right;
}
.activity-list {
  padding: 0 23px 17px;
}
.activity-item {
  display: flex;
  gap: 13px;
  padding: 12px 0;
}
.activity-item + .activity-item {
  border-top: 1px solid #f1f4f6;
}
.activity-dot {
  height: 7px;
  width: 7px;
  border: 2px solid #5bafa3;
  background: #e6f4ef;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
}
.activity-item strong {
  font-size: 10px;
  font-weight: 600;
  display: block;
}
.activity-item p {
  font-size: 9px;
  color: #7b8b95;
  margin: 2px 0;
}
.activity-item small {
  font-size: 8px;
  color: #98a5ac;
}
.app-footer {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  border-top: 1px solid var(--border);
  padding: 20px 0 23px;
  font-size: 9px;
  color: #93a0a9;
  margin-top: 10px;
}
.app-footer .muted {
  padding: 0 8px;
  color: #c1cbd0;
}
.filter-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 22px;
}
.filter-bar select {
  font-size: 11px;
  min-width: 170px;
}
.search-field {
  display: flex;
  align-items: center;
  position: relative;
  flex: 1;
  max-width: 450px;
}
.search-field svg {
  position: absolute;
  left: 12px;
  width: 17px;
  height: 17px;
  stroke: #7d929d;
  fill: none;
  stroke-width: 1.8;
}
.search-field input {
  width: 100%;
  padding-left: 38px;
  font-size: 11px;
}
.asset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

}

  stroke: #e9b453;
}
.annotation-rect.high {
  stroke: #f56c7d;
}
.annotation-rect.selected {

}

le="margin-top:24px">Storage & limitations</h3><p class="prose">Data is saved in this browser’s IndexedDB when permitted. Private browsing, moving the file, browser policies, clearing storage, or switching browser/profile may remove or hide the saved workspace. Export a backup or shareable HTML before moving it. If storage is blocked, the app displays a temporary-session warning.</p><p class="prose">Reports print locally through your browser. Choose Save as PDF in the print dialog. Chrome/Edge on a desktop or laptop are recommended for the drawing editor. Nothing is uploaded anywhere.</p><p class="prose">${DISCLAIMER}</p>${button("reset", "Reset demo data (confirmation required)", "", "secondary")}</section>`

  async function normalizedUpload(file) {
    assert(
      file.size > 0 && file.size <= 10 * 1024 * 1024,
      `${file.name}: use a non-empty image of 10 MB or less.`,
    );
    const bytes = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const jpeg = bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255;
    const png = [137, 80, 78, 71, 13, 10, 26, 10].every(
      (n, k) => bytes[k] === n,
    );
    assert(
      jpeg || png,
      `${file.name}: only actual JPEG or PNG images are supported.`,
    );
    const url = URL.createObjectURL(file);
    let bitmap;
    try {
      bitmap = globalThis.createImageBitmap
        ? await createImageBitmap(file, { imageOrientation: "from-image" })
        : await loadImage(url);
      const w = bitmap.width || bitmap.naturalWidth,
        h = bitmap.height || bitmap.naturalHeight;
      assert(
        Math.min(w, h) >= 64 && Math.max(w, h) <= 10000 && w * h <= 20000000,
        `${file.name}: use images from 64 px to 10,000 px per side, at most 20 megapixels.`,
      );
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const c = canvas.getContext("2d");
      c.fillStyle = "white";
      c.fillRect(0, 0, w, h);
      c.drawImage(bitmap, 0, 0);
      return {
        name: file.name.split(/[\\/]/).pop().slice(0, 255),
        dataUrl: canvas.toDataURL("image/jpeg", 0.9),
        width: w,
        height: h,
      };
    } catch (error) {
      throw new Error(error.message || `${file.name}: invalid image.`);
    } finally {
      bitmap?.close?.();
      URL.revokeObjectURL(url);
    }

    [0.1, 0.5],
    [0.1, 0.32],
    [1.9, 0.32],
    [1.9, 0.5],
    [2, 0.5],

function parseGeometry(source, filename, unit) {

    );
